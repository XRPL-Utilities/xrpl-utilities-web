<figure class="widget vault-facts">
  <ol class="ap-list vf-list">
    <li><span class="ap-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span><b>Shares are your receipt</b><span>Put money in and the vault gives you shares, a token it makes itself. Each share is worth the money in the vault divided by all the shares.</span></li>
    <li><span class="ap-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span><b>Late joiners pay today's value</b><span>Someone who joins later pays what a share is worth that day. They don't get interest earned before they showed up.</span></li>
    <li><span class="ap-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg></span><b>No dodging a loss</b><span>When a loan looks shaky, the broker can mark it down right away. Anyone who cashes out after that takes their part of the loss.</span></li>
    <li><span class="ap-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><b>Nobody holds the key</b><span>The money sits in an account the ledger makes for the vault. Nobody can sign for it. Money leaves only when a shareholder cashes out, the broker makes a loan, or the token's issuer takes its token back.</span></li>
  </ol>
</figure>
