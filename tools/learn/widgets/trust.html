<figure class="widget trust" data-widget="trust">
  <div class="widget-head"><strong>Try it: say yes to a token</strong></div>
  <p>Bob wants to pay you in dollar tokens from Example Bank. Go one step at a time and watch your wallet.</p>
  <div class="tr-wallet">
    <p class="tr-title">Your wallet</p>
    <p class="tr-empty" data-role="empty">No tokens. You haven't said yes to any yet.</p>
    <div class="tr-line" data-role="line" hidden>
      <p class="tr-name">USD from Example Bank</p>
      <p class="tr-nums" data-role="nums">0 of your 1,000 limit</p>
      <div class="tr-bar" aria-hidden="true"><span data-role="bar"></span></div>
      <p class="tr-res">0.2 XRP of your reserve is set aside for this.</p>
    </div>
  </div>
  <p class="tr-msg" data-role="msg" aria-live="polite"></p>
  <div class="tr-btns">
    <button type="button" class="replay tr-next" data-role="next">Next</button>
    <button type="button" class="replay tr-reset" data-role="reset">Start over</button>
  </div>
  <figcaption>Saying yes like this is called a trust line: one token, from one issuer, up to a limit you pick.</figcaption>
</figure>
