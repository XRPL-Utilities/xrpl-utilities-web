<figure class="hero-chain hero-tokens">
  <svg viewBox="0 0 520 300" role="img" aria-label="An issuer holds real dollars in a vault and sends matching tokens out to three accounts on the ledger.">
    <defs>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g><rect x="18" y="92" width="150" height="116" rx="14" class="card"/><rect x="18" y="92" width="150" height="116" rx="14" class="halo"/><text x="36" y="118" class="hd">ISSUER</text><text x="36" y="150" class="tk-big">Real dollars</text><text x="36" y="174" class="tk-small">one for every</text><text x="36" y="194" class="tk-small">token it sends</text></g>
    <path d="M176 150 C 250 150, 280 62, 352 62" class="lk"/><path d="M176 150 L 352 150" class="lk"/><path d="M176 150 C 250 150, 280 238, 352 238" class="lk"/>
    <circle r="11" class="tk-coin tk-c1"><animateMotion dur="3s" repeatCount="indefinite" path="M176 150 C 250 150, 280 62, 352 62"/></circle>
    <circle r="11" class="tk-coin tk-c2"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M176 150 L 352 150"/></circle>
    <circle r="11" class="tk-coin tk-c3"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M176 150 C 250 150, 280 238, 352 238"/></circle>
    <g><rect x="360" y="38" width="142" height="48" rx="10" class="card"/><text x="378" y="68" class="tk-acct">Alice: 50 USD</text></g>
    <g><rect x="360" y="126" width="142" height="48" rx="10" class="card"/><text x="378" y="156" class="tk-acct">Bob: 20 USD</text></g>
    <g><rect x="360" y="214" width="142" height="48" rx="10" class="card"/><text x="378" y="244" class="tk-acct">Carol: 30 USD</text></g>
  </svg>
  <figcaption>A token is a promise from its issuer. A dollar token is only worth a dollar if the issuer really holds one for it.</figcaption>
</figure>
