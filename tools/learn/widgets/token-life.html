<figure class="widget token-life" data-widget="token-life">
  <div class="widget-head"><strong>Try it: follow one dollar token</strong></div>
  <p>Press the button to move one step at a time. Watch the vault and the tokens.</p>
  <div class="tl-grid">
    <p class="tl-h"></p><p class="tl-h">You</p><p class="tl-h tl-iss">Issuer</p><p class="tl-h">Your friend</p>
    <p class="tl-row">Real money<span>off the ledger</span></p>
    <p class="tl-cell" data-cell="you-cash"><span class="chip cash">1 dollar</span></p>
    <p class="tl-cell tl-vault" data-cell="vault"><span class="tl-k">In the vault</span><b>0 dollars</b></p>
    <p class="tl-cell" data-cell="friend-cash"></p>
    <p class="tl-row">Tokens<span>on the ledger</span></p>
    <p class="tl-cell" data-cell="you-tok"></p>
    <p class="tl-cell tl-vault" data-cell="out"><span class="tl-k">Tokens out</span><b>0</b></p>
    <p class="tl-cell" data-cell="friend-tok"></p>
  </div>
  <p class="tl-msg" data-role="msg" aria-live="polite">You have a real dollar. The issuer's vault is empty.</p>
  <div class="tr-btns">
    <button type="button" class="replay tr-next" data-role="next">Step 1: Hand the issuer your dollar</button>
    <button type="button" class="replay tr-reset" data-role="reset">Start over</button>
  </div>
  <figcaption>The vault and the tokens out always match. The ledger only sees the tokens row, so you trust the issuer about the vault.</figcaption>
</figure>
