<figure class="widget kinds">
  <div class="ow-grid kinds-grid">
    <div class="ow-card"><span class="ow-tag">Trust line tokens</span><b>The original</b><span>Each holder opens a trust line to the issuer. This is the kind the ledger started with.</span></div>
    <div class="ow-card"><span class="ow-tag">Multi-Purpose Tokens</span><b>The newer kind</b><span>Often called MPTs. Built for things like funds and bonds, with the issuer's rules set when the token is made. Lesson 8 comes back to these.</span></div>
    <div class="ow-card ow-xrp"><span class="ow-tag">NFTs</span><b>One of a kind</b><span>Each one is unique, like a ticket to one seat or a piece of art. They aren't used for payments.</span></div>
