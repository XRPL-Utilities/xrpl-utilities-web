<figure class="widget reserve" data-widget="reserve">
  <div class="widget-head"><strong>Try it: what your account keeps locked</strong></div>
  <p>Every account starts with 1 XRP set aside. Add things to the account and watch the locked amount grow.</p>
  <ul class="rs-list">
    <li><span class="rs-name">A token you hold, like a stablecoin</span><span class="rs-ctl"><button type="button" class="rs-btn" data-item="token" data-step="-1" aria-label="Remove a token">&minus;</button><output data-count="token">0</output><button type="button" class="rs-btn" data-item="token" data-step="1" aria-label="Add a token">+</button></span></li>
    <li><span class="rs-name">An open offer to swap currencies</span><span class="rs-ctl"><button type="button" class="rs-btn" data-item="offer" data-step="-1" aria-label="Remove an offer">&minus;</button><output data-count="offer">0</output><button type="button" class="rs-btn" data-item="offer" data-step="1" aria-label="Add an offer">+</button></span></li>
    <li><span class="rs-name">An escrow, XRP set aside to pay out later</span><span class="rs-ctl"><button type="button" class="rs-btn" data-item="escrow" data-step="-1" aria-label="Remove an escrow">&minus;</button><output data-count="escrow">0</output><button type="button" class="rs-btn" data-item="escrow" data-step="1" aria-label="Add an escrow">+</button></span></li>
  </ul>
  <div class="rs-bar" aria-hidden="true"><span class="rs-base"></span><span class="rs-extra" data-role="bar"></span></div>
  <p class="rs-total" data-role="total" aria-live="polite">Locked: 1 XRP. That's the base amount every account needs.</p>
  <figcaption>Each item adds 0.2 XRP. Remove it and that 0.2 XRP is yours to spend again.</figcaption>
</figure>
