<figure class="widget live lam" data-widget="live-amend">
  <div class="widget-head">
    <span class="dot" aria-hidden="true"></span>
    <strong>Being voted on right now</strong>
  </div>
  <p class="live-status" data-role="status" aria-live="polite">Checking the latest votes...</p>
  <div class="lam-recent" data-role="recent-wrap" hidden>
    <p class="lam-sub">Just switched on</p>
    <ul class="lam-list" data-role="recent"></ul>
    <p class="lam-sub">Still in the vote</p>
  </div>
  <ul class="lam-list" data-role="list"></ul>
  <p class="lam-total" data-role="total"></p>
  <button type="button" class="replay" data-role="refresh">Check the latest votes</button>
  <figcaption>The white line is how many yes votes each feature needs. The total can dip under 35 when a validator misses a count.</figcaption>
</figure>
