<figure class="widget amend-vote" data-widget="amend-vote">
  <div class="widget-head"><strong>Try it: get a feature switched on</strong></div>
  <p>Set how many of the 35 validators say yes, then let the days go by. The feature needs 28 yes votes, every day, for 14 days.</p>
  <div class="av-dots" data-role="dots" aria-hidden="true"></div>
  <div class="av-row">
    <button type="button" class="replay av-minus" data-role="minus" aria-label="One fewer yes vote">−</button>
    <p class="av-count" data-role="count">20 of 35 say yes</p>
    <button type="button" class="replay av-plus" data-role="plus" aria-label="One more yes vote">+</button>
  </div>
  <div class="av-days" data-role="days" aria-hidden="true"></div>
  <p class="av-msg" data-role="msg" aria-live="polite">Day 0 of 14. Not enough yes votes yet.</p>
  <div class="tr-btns">
    <button type="button" class="replay tr-next" data-role="day">Let a day pass</button>
    <button type="button" class="replay tr-reset" data-role="reset">Start over</button>
  </div>
  <figcaption>Drop below 28 on any day and the two-week clock starts over from zero.</figcaption>
</figure>
