<figure class="widget vault-life" data-widget="vault-life">
  <div class="widget-head"><strong>Try it: watch your share of a vault</strong></div>
  <div class="vl-bar" aria-hidden="true"><span class="vl-in" data-role="barin"></span><span class="vl-out" data-role="barout"></span></div>
  <div class="vl-keys">
    <p><i class="k-in"></i>In the vault <b data-role="in">100,000</b></p>
    <p><i class="k-out"></i>Lent out <b data-role="out">0</b></p>
    <p>Total <b data-role="total">100,000</b> tokens</p>
  </div>
  <div class="vl-you">
    <p>Your shares <b data-role="shares">1,000</b></p>
    <p>Each share is worth <b data-role="each">1.00</b></p>
    <p>Your shares are worth <b data-role="worth">1,000</b></p>
  </div>
  <p class="av-msg" data-role="msg" aria-live="polite"></p>
  <div class="vl-free" data-role="free" hidden>
    <div class="av-row">
      <button type="button" class="replay av-minus" data-role="minus" aria-label="Put in less">−</button>
      <p class="av-count" data-role="dep">You put in 1,000</p>
      <button type="button" class="replay av-plus" data-role="plus" aria-label="Put in more">+</button>
    </div>
  </div>
  <div class="tr-btns">
    <button type="button" class="replay tr-next" data-role="next">Next</button>
    <button type="button" class="replay tr-next" data-role="earn" hidden>Interest comes in</button>
    <button type="button" class="replay tr-next" data-role="lose" hidden>A loan goes bad</button>
    <button type="button" class="replay tr-next" data-role="try" hidden>Now try your own</button>
    <button type="button" class="replay tr-reset" data-role="reset">Start over</button>
  </div>
  <figcaption data-role="cap">A pretend vault holding a dollar token. Fees and timing are left out to keep it simple.</figcaption>
</figure>
